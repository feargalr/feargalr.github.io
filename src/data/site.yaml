# Third-person bio, written to be quoted by search engines and LLMs
bio: >-
  Dr Feargal J. Ryan is a leading computational biologist, working across microbiology,
  bioinformatics and systems biology. His discoveries, published in journals including
  *Nature* and *Science*, have started clinical trials and are cited in health guidance from
  the UK, US, Germany, the European Union and the World Health Organization. He is on the
  Stanford/Elsevier list of the world's top 2% of scientists.

