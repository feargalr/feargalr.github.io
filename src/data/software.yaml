# Methods papers and best-practice guidance
methods:
  - title: Pitfalls in human metagenomic analyses
    venue: Microbiology Australia
    year: 2026
    doi: 10.1071/ma26130
    code: https://github.com/feargalr/hmp_2012_stool_taxon_prevalence
    summary: Common traps in human metagenome studies, from sparse and low-prevalence taxa to reproducibility, illustrated with public stool metagenomes.
  - title: Choice of assembly software has a critical impact on virome characterisation
    venue: Microbiome
    year: 2019
    doi: 10.1186/s40168-019-0626-5
    summary: A benchmark showing that the assembler you pick changes which viruses you find, and by how much.
  - title: Reproducible protocols for metagenomic analysis of human faecal phageomes
    venue: Microbiome
    year: 2018
    doi: 10.1186/s40168-018-0446-z
    summary: Laboratory and computational protocols for consistent, comparable studies of the bacteriophages in human stool.
