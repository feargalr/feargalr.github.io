name: Refresh publication data

on:
  schedule:
    - cron: '0 18 1 * *'   # 1st of each month, 18:00 UTC (early morning in Adelaide)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run update-data
      - name: Commit changes
        run: |
          if git diff --quiet -- src/data; then
            echo "No changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
            git add src/data
            git commit -m "Refresh publications and download stats"
            git push
          fi
